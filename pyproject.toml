[project]
name = "waha-langchain-mcp"
version = "0.1.0"
description = "MCP server exposing a local WAHA (WhatsApp HTTP API) instance as tools for LangChain ReAct and deep agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "waha", "whatsapp", "langchain", "agents"]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.24.0,<2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
examples = [
    "langchain>=1.0.0",
    "langgraph>=1.0.0",
    "langchain-mcp-adapters>=0.2.0",
    "langchain-openai>=0.3.0",
    "langchain-openrouter>=0.2.0",
    "deepagents>=0.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/waha_mcp"]

[project.scripts]
waha-mcp = "waha_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
